<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Match3 Web</title>
<style>
  :root { --hud-fg: #fff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1229; font-family: "Helvetica Neue", Arial, "PingFang TC", sans-serif; }
  #game { position: absolute; inset: 0; }
  #game canvas { display: block; touch-action: none; }

  /* ===== 頂部 HUD（Royal Match 風格）===== */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; padding: 14px 12px 0;
    display: flex; align-items: flex-start; justify-content: center;
    color: #4a2410; pointer-events: none; user-select: none;
    font-family: "Arial Rounded MT Bold", "Helvetica Neue", "PingFang TC", sans-serif;
  }
  /* 外層酒紅色牌匾：把頭像 + Goals + Moves 全包起來 */
  #topBar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: linear-gradient(180deg, #a03046 0%, #7d1f31 45%, #6a1826 100%);
    border: 3px solid #55101c; border-radius: 26px;
    box-shadow:
      0 5px 12px rgba(0,0,0,.45),
      inset 0 2px 0 rgba(255,255,255,.18),
      inset 0 -4px 0 rgba(0,0,0,.28);
  }
  /* 左：頭像框 */
  #avatarFrame {
    flex: 0 0 auto; width: 74px; height: 74px; border-radius: 20px;
    background: linear-gradient(180deg, #9a4f28, #6b3013);
    border: 3px solid #f7c04a;
    box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 0 0 2px #a3541f;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  #avatarFrame canvas { width: 92%; height: 92%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  /* 中/右：面板卡（牌匾內的米色內嵌板） */
  .topPanel {
    position: relative; min-height: 74px; border-radius: 18px;
    background: linear-gradient(180deg, #fff8e6 0%, #f6e6c4 100%);
    border: 2px solid #55101c;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.18), inset 0 -3px 0 rgba(160,120,50,.25);
    padding: 18px 16px 8px; display: flex; align-items: center; justify-content: center;
  }
  .panelBanner {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #e8493a, #b31f1f);
    border: 2px solid #f0b840; border-radius: 999px;
    color: #fff; font-weight: 800; font-size: 14px; letter-spacing: .5px;
    padding: 2px 16px; white-space: nowrap;
    box-shadow: 0 2px 4px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35);
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
    z-index: 1;
  }
  #goalsPanel { flex: 0 1 auto; max-width: 52vw; }
  #objectives { display: flex; gap: 14px; align-items: center; }
  .obj { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .obj img { width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
  .obj .swatch { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset -3px -4px 6px rgba(0,0,0,.3); }
  .obj .star { font-size: 30px; color: #f4b63f; text-shadow: 0 2px 2px rgba(0,0,0,.3); }
  .obj .count {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    min-width: 20px; padding: 0 5px; border-radius: 999px;
    background: linear-gradient(180deg, #e8493a, #b31f1f); border: 2px solid #fff;
    color: #fff; font-size: 12px; font-weight: 800; text-align: center; line-height: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .obj.done .count { background: linear-gradient(180deg, #57c94f, #2c9930); }
  #movesPanel { flex: 0 0 auto; min-width: 92px; }
  .movesNum { font-size: 34px; font-weight: 900; color: #4a2410; line-height: 1; text-shadow: 0 1px 0 #fff; }
  #movesPanel.low .movesNum { color: #d31f1f; animation: movesPulse .7s ease-in-out infinite; }
  @keyframes movesPulse { 50% { transform: scale(1.18); } }
  /* 分數/聲音/選關 — 下排，跟上排卡片同款式 */
  #bottomBar {
    position: fixed; left: 0; right: 0; bottom: 16px;
    display: flex; justify-content: center; align-items: flex-end; gap: 16px;
    pointer-events: none;
  }
  #bottomBar > * { pointer-events: auto; }
  #scorePanel {
    min-width: 170px;
    border: 3px solid #caa04f;
    box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 -4px 0 rgba(160,120,50,.25);
  }
  .scoreNum { font-size: 34px; font-weight: 900; color: #4a2410; line-height: 1; text-shadow: 0 1px 0 #fff; }
  .iconCard {
    width: 74px; height: 74px; border-radius: 18px;
    background: linear-gradient(180deg, #fff8e6 0%, #f6e6c4 100%);
    border: 3px solid #caa04f;
    box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 -4px 0 rgba(160,120,50,.25);
    font-size: 32px; cursor: pointer;
  }
  .iconCard:hover { filter: brightness(1.08); }

  /* 全螢幕覆蓋（選單/勝負） */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(12, 8, 24, .92); color: #fff; z-index: 10;
  }
  .overlay h1 { font-size: 34px; letter-spacing: 2px; }
  .overlay h2 { font-size: 24px; }
  .overlay .sub { opacity: .75; font-size: 15px; }
  .overlay button {
    background: linear-gradient(180deg, #8a5cf5, #6a3de0); color: #fff; border: 0;
    border-radius: 12px; padding: 12px 34px; font-size: 18px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 14px rgba(105, 60, 220, .45);
  }
  .overlay button.secondary { background: rgba(255,255,255,.12); box-shadow: none; }
  .overlay button:hover { filter: brightness(1.12); }
  #levelGrid {
    display: grid; grid-template-columns: repeat(10, 52px); gap: 8px;
    max-height: 60vh; overflow-y: auto; padding: 6px;
  }
  #levelGrid button {
    width: 52px; height: 52px; padding: 0; font-size: 15px; border-radius: 10px;
    background: rgba(255,255,255,.10); box-shadow: none;
  }
  #levelGrid button:hover { background: rgba(138, 92, 245, .55); }
  #themeRow { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  #themeRow select {
    background: #241740; color: #fff; border: 1px solid rgba(140,110,220,.5);
    border-radius: 8px; padding: 6px 10px; font-size: 14px;
  }
  .stars { font-size: 40px; letter-spacing: 6px; color: #ffd84d; }
  .hidden { display: none !important; }
  #loading { z-index: 20; }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hidden">
    <div id="topBar">
      <div id="avatarFrame"><canvas id="avatarCanvas" width="256" height="256"></canvas></div>
      <div class="topPanel" id="goalsPanel">
        <div class="panelBanner">Goals</div>
        <div id="objectives"></div>
      </div>
      <div class="topPanel" id="movesPanel">
        <div class="panelBanner">Moves</div>
        <div class="movesNum" id="movesVal">0</div>
      </div>
    </div>
    <div id="bottomBar">
      <div class="topPanel" id="scorePanel">
        <div class="panelBanner">Score</div>
        <div class="scoreNum" id="scoreVal">0</div>
      </div>
      <button class="iconCard" id="muteBtn" title="靜音">🔊</button>
      <button class="iconCard" id="menuBtn" title="回選單">☰</button>
    </div>
  </div>

  <div id="loading" class="overlay"><h2>載入素材中…</h2><div class="sub" id="loadingSub"></div></div>

  <div id="menu" class="overlay hidden">
    <h1>MATCH-3</h1>
    <div id="themeRow">
      <span>美術主題</span>
      <select id="themeSelect"><option value="">預設（godot 素材）</option></select>
    </div>
    <div id="levelGrid"></div>
  </div>

  <div id="result" class="overlay hidden">
    <h1 id="resultTitle"></h1>
    <div class="stars" id="resultStars"></div>
    <div class="sub" id="resultScore"></div>
    <div style="display:flex; gap:12px">
      <button id="retryBtn">再玩一次</button>
      <button id="nextBtn">下一關</button>
      <button id="backBtn" class="secondary">回選單</button>
    </div>
  </div>

  <script src="vendor/pixi.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
